<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanic Survival Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Titanic Predictor</h2>
            <p>Enter passenger details to calculate survival probability.</p>
        </header>

        <div class="form-group">
            <label>Passenger Class</label>
            <select id="pclass">
                <option value="1">1st Class</option>
                <option value="2">2nd Class</option>
                <option value="3" selected>3rd Class</option>
            </select>
        </div>

        <div class="form-group-row">
            <div class="form-group">
                <label>Sex</label>
                <select id="sex">
                    <option value="0">Male</option>
                    <option value="1">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" value="26">
            </div>
        </div>

        <div class="form-group-row">
            <div class="form-group">
                <label>Siblings / Spouses Aboard</label>
                <input type="number" id="sibsp" value="0">
            </div>
            <div class="form-group">
                <label>Parents / Children Aboard</label>
                <input type="number" id="parch" value="0">
            </div>
        </div>

        <div class="form-group">
            <label>Fare ($)</label>
            <input type="number" id="fare" value="7.925" step="0.01">
        </div>

        <button id="predict-btn" onclick="predict()">
            <span id="btn-text">Predict Survival</span>
            <div class="spinner" id="spinner"></div>
        </button>

        <div id="result-container">
            <div id="result-badge"></div>
            <div id="result-text"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
